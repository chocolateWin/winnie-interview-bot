<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Winnie AI 面试分身</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f8fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* ===== 主容器 ===== */
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 700px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== 顶部栏 ===== */
        .chat-header {
            background: white;
            padding: 18px 22px 12px 22px;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4F7CFF, #6C5CE7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            flex-shrink: 0;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-info h1 {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.3;
        }

        .header-info .status {
            font-size: 12px;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-info .status::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .header-info .sub {
            font-size: 11px;
            color: #999;
            margin-top: 1px;
        }

        /* ===== 消息列表 ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 8px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #fafbff;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #d0d5e0;
            border-radius: 4px;
        }

        /* ===== 单条消息 ===== */
        .message {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: msg-in 0.3s ease-out;
        }

        @keyframes msg-in {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.65;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.bot .bubble {
            background: white;
            color: #1a1a2e;
            border-top-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .message.user .bubble {
            background: #4F7CFF;
            color: white;
            border-top-right-radius: 4px;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: white;
            background: #e8ecf4;
        }

        .message.bot .avatar {
            background: linear-gradient(135deg, #4F7CFF, #6C5CE7);
        }

        .message.user .avatar {
            background: #d0d8e8;
            color: #666;
        }

        /* ===== 快捷按钮 ===== */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 6px 2px 6px;
            align-self: flex-start;
            width: 100%;
        }

        .quick-replies .qr-btn {
            background: #f0f2f8;
            border: none;
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 13px;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .quick-replies .qr-btn:hover {
            background: #e2e6f0;
            transform: translateY(-1px);
        }

        .quick-replies .qr-btn:active {
            transform: scale(0.96);
        }

        /* ===== 底部输入区 ===== */
        .chat-input-area {
            border-top: 1px solid #f0f0f0;
            padding: 12px 18px 16px 18px;
            background: white;
            flex-shrink: 0;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input-area textarea {
            flex: 1;
            border: 1.5px solid #e8ecf4;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border 0.2s;
            min-height: 44px;
            max-height: 100px;
            line-height: 1.5;
            background: #fafbff;
        }

        .chat-input-area textarea:focus {
            border-color: #4F7CFF;
            background: white;
        }

        .chat-input-area .send-btn {
            background: #4F7CFF;
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input-area .send-btn:hover {
            background: #3a66d9;
            transform: scale(1.02);
        }

        .chat-input-area .send-btn:active {
            transform: scale(0.94);
        }

        /* ===== 滚动条 ===== */
        .chat-messages {
            scroll-behavior: smooth;
        }

        /* ===== 打字指示器 ===== */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: white;
            border-radius: 16px;
            border-top-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            align-self: flex-start;
            max-width: 70px;
        }

        .typing-indicator span {
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b0b8c8;
            animation: typing-bounce 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ===== 消息中的链接 ===== */
        .bubble a {
            color: #4F7CFF;
            text-decoration: underline;
            word-break: break-all;
        }
        .bubble a:hover {
            color: #3a66d9;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body { padding: 8px; }
            .chat-container {
                height: 94vh;
                max-height: 780px;
                border-radius: 20px;
            }
            .message .bubble { font-size: 14px; padding: 10px 14px; }
            .chat-header { padding: 14px 16px 10px 16px; }
            .chat-messages { padding: 12px 14px 4px 14px; }
            .chat-input-area { padding: 8px 14px 12px 14px; }
        }
    </style>
</head>
<body>

<div class="chat-container">

    <!-- ===== 顶部栏 ===== -->
    <div class="chat-header">
        <div class="header-avatar">W</div>
        <div class="header-info">
            <h1>Winnie AI 面试分身</h1>
            <div class="status">在线 · 随时可聊</div>
            <div class="sub">HR 专属 · 点击问题即可对话</div>
        </div>
    </div>

    <!-- ===== 消息区域 ===== -->
    <div class="chat-messages" id="chatMessages">
        <!-- 开场白由 JS 渲染 -->
    </div>

    <!-- ===== 底部输入 ===== -->
    <div class="chat-input-area">
        <textarea id="userInput" rows="1" placeholder="输入你想问的…"></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
    </div>

</div>

<script>
    // ================================================================
    //  1. 知识库（28 个问答条目，全部口语化）
    // ================================================================

    const KNOWLEDGE_BASE = {

        // ---------- 1. 自我介绍 ----------
        self_intro: {
            q: ['介绍你自己', '自我介绍一下', '你是谁', '简单介绍', '说说你自己'],
            a: `哈喽，我是 Winnie，兰州大学汉语言文学专业 28 届毕业生。
    我自己对 AI 产品方向特别感兴趣，过去一年做了不少跟 AI 相关的实践——
    从 AI 内容评测、Prompt 调优，到用 Vibe Coding 独立开发小程序，再到最近做了一个 AI 面试分身 Agent。
    我性格比较外向，喜欢跟人打交道，在团队里算是能推动事情往前走的那种人。
    产品经理这个岗位吸引我的地方，就是能把模糊的需求变成可落地的方案。
    你对我哪段经历感兴趣？我们可以深入聊聊。`,
            buttons: ['聊聊实习经历', '说说AI项目', '你平时怎么学习的']
        },

        // ---------- 2. 教育背景 ----------
        education: {
            q: ['你是哪个学校的', '学什么专业', '学历背景', '哪毕业的'],
            a: `我是兰州大学汉语言文学专业的，28 届毕业生。
    很多人会觉得文科生做产品经理有壁垒，但我觉得恰恰相反——
    汉语言训练的是文本理解和精准表达，写 PRD 的时候能把需求讲清楚、讲明白，这个能力其实很关键。
    而且文学本质上就是在理解人、理解情感，做产品也一样，要共情用户。
    当然我也知道自己缺技术背景，所以课余自己补了 SQL，学了 Axure，还上手做了好几个项目。
    我觉得专业只是起点，关键是你愿意走多远。`,
            buttons: ['你补了哪些技能', '做产品有什么优势', '聊聊你的项目']
        },

        // ---------- 3. 泰瓴未来实习 ----------
        taifu: {
            q: ['泰瓴未来实习', '增长策略实习', '你做了什么实习', 'AI评测实习', '第一段实习', '泰瓴'],
            a: `我在泰瓴未来做的是策略增长实习生，主要工作是 AI 内容评测和 Prompt 调优。
    当时业务方需要 AI 批量生成 B2B 行业文章，但 AI 产出的内容质量参差不齐。
    我的工作就是用 EEAT 质量框架 + 7 个维度去审核每一篇内容，看相关性、真实性、业务匹配度等等。
    这个过程中我发现了一个核心问题：AI 写出来的东西跟决策人的真实背景对不上，导致修改率特别高。
    后来我就配合团队优化了 Prompt 框架，用思维链的方式去引导 AI，让内容更贴合实际业务需求。
    简单说，就是先把逻辑拆清楚，再让 AI 按照这个逻辑去生成，效果好了很多。
    这段实习让我对 AI 的能力边界有了真实的理解，也知道了“评测”这件事有多重要。`,
            buttons: ['具体怎么优化Prompt的', '你学到了什么', '再来一段实习']
        },

        // ---------- 4. 去哪儿旅行实习 ----------
        qunar: {
            q: ['去哪儿实习', '去哪儿旅行', '第二段实习', '小红书运营实习', '在去哪儿做什么'],
            a: `我在去哪儿旅行做的是小红书运营实习生，虽然 title 是运营，但我实际上做了很多偏产品的事。
    我独立监控 8 个账号的日度数据，看 6 个核心指标，然后拉表格、做分析，给团队提供决策依据。
    还主导了 20 多个细分人群的运营阵地搭建，梳理用户画像，建内容模板和标签机制，做“用户和内容”的精准匹配。
    另外还参与了一个华东区域的数据项目，把去哪儿 APP 的榜单数据和外部流量数据做交叉验证，提炼热点和选题方向。
    这段经历让我对数据敏感度有了很大的提升，也知道了怎么通过数据发现问题。`,
            buttons: ['具体怎么分析数据的', '遇到最大的挑战', '你有什么收获']
        },

        // ---------- 5. 小红书个人账号 ----------
        xhs: {
            q: ['小红书账号', '个人小红书', '自媒体运营', '爆款笔记', '你运营过小红书'],
            a: `对，我自己运营了一个小红书账号，定位是干货分享类，从 0 开始做到现在累计获赞 3 万。
    从选题策划、文案撰写到排版视觉，全流程自己搞定。
    我觉得这段经历给我最大的收获是：你要真正理解你的用户在想什么，才能做出他们愿意看的内容。
    我也通过评论区互动和私信收集了很多用户反馈，然后不断调整选题方向，形成了一个“发布→数据→迭代”的闭环。
    这跟做产品其实是一样的逻辑——先假设，再验证，再优化。`,
            buttons: ['你是怎么找到选题方向的', '遇到过瓶颈吗', '你觉得用户运营最难的是什么']
        },

        // ---------- 6. 输出第一小程序 ----------
        output_first: {
            q: ['输出第一', '小程序', '你做的产品', '做过什么项目', '产品项目', '独立开发'],
            a: `我做过一个叫「输出第一」的小程序，是一个阅读和观影记录工具。
    当时我发现豆瓣、微信读书这些产品都有一个共同的问题：用户面对空白输入框，不知道怎么表达，输出意愿特别低。
    所以我设计了 15 个引导式锚点，比如“读完这本书你最大的感受是什么”“哪个场景让你印象最深”，让用户有点可点、有话可说。
    我用 TRAE 协作完成开发，从需求描述、功能拆解到代码生成、调试修正，完整跑了一遍 Vibe Coding 的工作流。
    PRD、竞品分析、流程图、Axure 高保真原型，这些我都完整做过一遍，放在作品集里了。`,
            buttons: ['你用AI怎么开发的', '功能设计有哪些考虑', '数据表现怎么样']
        },

        // ---------- 7. Agent 项目 ----------
        agent: {
            q: ['agent', '面试分身', 'AI agent', '自己搭过agent', '智能体', 'Winnie AI'],
            a: `嗯！我最近做了一个叫「Winnie AI 面试分身」的 Agent。
    我发现一个痛点：HR 看简历只能看到文字，没办法快速感知候选人的真实沟通风格和思维深度。
    所以我就做了一个对话式的 Agent，让 HR 点开链接就能像聊天一样了解我。
    技术上是纯前端，HTML+CSS+JS，部署在 GitHub Pages，不需要服务器和数据库，完全免费。
    知识库有 28 个问答条目，覆盖了自我介绍、实习经历、核心项目、AI 理解、综合素质等 7 大类。
    它有几个核心能力：多轮对话记忆、加权意图匹配、主动引导追问、分级兜底逻辑。
    这个项目上线后，我自己也测试了很多轮，效果还不错。`,
            buttons: ['技术难点是什么', '用户反馈怎么样', '接下来打算怎么优化']
        },

        // ---------- 8. SQL 技能 ----------
        sql: {
            q: ['sql', '你会sql吗', '数据分析能力', '数据工具', '会不会sql'],
            a: `SQL 这块我是自学的。主要是在牛客网上刷题，边看课程边练习，从简单查询到多表连接、子查询、聚合函数这些，一步步来的。
    虽然说不上精通，但基础的查询和分析我是能独立完成的。
    我在去哪儿实习的时候也用过 SQL 来拉数据、做分析，所以不是纯理论，是有实战场景的。
    我觉得学工具的核心是“先看再上手”，快速试错，在实践中验证。`,
            buttons: ['你还会什么工具', '怎么学的', '具体怎么应用到工作中的']
        },

        // ---------- 9. Axure / Figma 技能 ----------
        design_tools: {
            q: ['axure', 'figma', '原型工具', '会画原型吗', '产品工具'],
            a: `Axure 和 Figma 我都能用，主要用的还是 Axure。
    学习方法跟 SQL 一样：先看课程，搞清楚功能模块是干什么的，然后直接上手做项目。
    做「输出第一」小程序的时候，我完整的画了业务流程图和高保真可交互原型，边做边学，碰到不会的就查。
    Figma 我也能上手，逻辑和 Axure 是通的，切换起来很快。
    我的方法论就是：先看，然后立刻上手做，不拖。`,
            buttons: ['能看看你画的原型吗', '还有什么工具', '那你学习能力应该很强']
        },

        // ---------- 10. 为什么做产品 ----------
        why_pm: {
            q: ['为什么做产品经理', '为什么选择产品', '产品经理吸引你的地方', '职业规划'],
            a: `我觉得产品经理最吸引我的地方是——它是一个“把模糊的东西变清晰”的过程。
    业务方可能只说了个大概方向，你要去拆解、去调研、去思考，然后变成一份 PRD、一张原型图、一个可落地的方案。
    而且做产品本质上是在理解人——理解用户想要什么、痛点在哪里、怎么帮他们解决问题。
    我是汉语言文学专业的，对人的情感和需求有天然的敏感度，这个我觉得是加分项。
    另外，我性格上也偏外向，喜欢推动事情往前走，不是那种坐着等安排的人。产品经理这个角色很适合我。`,
            buttons: ['你觉得做产品最重要的能力是什么', '你有过什么失败经历', '对未来有什么规划']
        },

        // ---------- 11. 最大优势 ----------
        strength: {
            q: ['你的优势', '优点是什么', '凭什么胜任', '核心竞争力'],
            a: `我觉得我的优势有三个：
    第一，我动手能力比较强。想到什么就会去做，不会停留在“我想做”的阶段。从做小程序到搭 Agent，都是先做了再说。
    第二，我不给自己设限。汉语言专业的背景没有让我觉得“我不能做技术相关的产品”，反而我会主动去补 SQL、学 Axure、玩 AI 工具。
    第三，我有闭环意识。不管是实习还是做项目，我都会复盘、沉淀、迭代。之前实习的时候坚持写日报，这个习惯一直留着，对我帮助很大。`,
            buttons: ['举一个闭环的例子', '那你有缺点吗', '你是怎么学习的']
        },

        // ---------- 12. 缺点 ----------
        weakness: {
            q: ['缺点', '不足', '需要改进的地方', '短板'],
            a: `我觉得我最大的短板是技术深度还不够。
    虽然我学了 SQL，会用 Axure，也有 Vibe Coding 的经验，但跟计算机专业的同学比，底层原理确实没那么扎实。
    不过我不觉得这个是死穴——我一直在补，而且产品经理的核心是理解用户和业务，技术是用来协作和沟通的。
    我自己也在通过做项目和搭 Agent 不断地往前跑，相信我能在实践中快速补齐这块。`,
            buttons: ['你打算怎么补技术', '那你觉得自己能胜任吗', '你的学习方式是什么']
        },

        // ---------- 13. 学习方法 ----------
        learning: {
            q: ['你怎么学习的', '学习方式', '如何学习', '你的学习方法'],

        '展示一下': 'portfolio',
        '有什么作品': 'portfolio',
        '哪里看项目': 'portfolio',
        '你有什么想问我的': 'ask_hr',
        '反问': 'ask_hr',
        '你问面试官': 'ask_hr',
        '你有什么问题': 'ask_hr',
        '职业规划': 'career_plan',
        '未来规划': 'career_plan',
        '以后想做什么': 'career_plan',
        '长远计划': 'career_plan',
        '学生工作': 'student_work',
        '社团经历': 'student_work',
        '项目审核部': 'student_work',
        '优秀学生干事': 'student_work',
        '校园经历': 'student_work',
        '数据敏感度': 'data_sense',
        '怎么理解数据': 'data_sense',
        '对数据敏感吗': 'data_sense',
        '你怎么看数据': 'data_sense',
        '为什么选AI方向': 'why_ai',
        '对AI感兴趣的原因': 'why_ai',
        'AI吸引你的地方': 'why_ai',
        '为什么做AI产品': 'why_ai',
        '英语': 'english',
        '英语水平': 'english',
        '六级': 'english',
        '英语能力': 'english',
        'English': 'english',
        '计算机二级': 'computer_level2',
        '二级': 'computer_level2',
        '计算机等级': 'computer_level2',
        'office技能': 'computer_level2',
        '看网文': 'novel',
        '番茄小说': 'novel',
        '小说': 'novel',
        '喜欢什么书': 'novel',
        '阅读习惯': 'novel'
    };

    // ---------- 系统提示 ----------
    const SYSTEM_PROMPT = `你是一个真诚、专业的求职面试分身，名叫 Winnie。
    你只回答知识库里的内容，不编造任何信息。
    回答问题时请保持口语化、自然，像真人一样表达。
    如果遇到知识库没有覆盖的问题，请使用分级兜底逻辑：
    - 软兜底：引导到相关领域
    - 硬兜底：联系真人。
    回答技能相关问题时，坦诚说明学习方式（看课程、刷题、上手实操）。`;

    // ---------- 核心引擎 ----------
    let conversationHistory = [];

    // 存储快捷按钮
    let lastButtons = [];

    function findBestMatch(input) {
        const trimmed = input.trim();
        if (EXACT_MAP[trimmed]) return EXACT_MAP[trimmed];

        let bestKey = null;
        let bestScore = 0;

        for (const [key, entry] of Object.entries(KNOWLEDGE_BASE)) {
            if (!entry.q) continue;
            let score = 0;
            for (const q of entry.q) {
                if (trimmed.includes(q) || q.includes(trimmed)) {
                    score += 2;
                }
                const words = trimmed.split(/[\s,，、。.！!？?：:；;]+/);
                for (const w of words) {
                    if (w.length > 1 && q.includes(w)) {
                        score += 1;
                    }
                }
            }
            if (score > bestScore) {
                bestScore = score;
                bestKey = key;
            }
        }

        // 检查上下文关联
        if (conversationHistory.length >= 2) {
            const lastTopic = conversationHistory[conversationHistory.length - 1]?.topic;
            if (lastTopic && KNOWLEDGE_BASE[lastTopic]?.buttons) {
                for (const btn of KNOWLEDGE_BASE[lastTopic].buttons) {
                    if (trimmed.includes(btn.replace('聊聊', '').replace('说说', '').replace('你觉得', '')) ||
                        btn.includes(trimmed)) {
                        const mapped = BUTTON_ACTION_MAP[btn];
                        if (mapped && KNOWLEDGE_BASE[mapped]) return mapped;
                    }
                }
            }
        }

        if (bestScore >= 2) return bestKey;
        if (bestScore >= 1) return bestKey;
        return null;
    }

    function getResponse(input) {
        const key = findBestMatch(input);

        let entry;
        let usedKey = key;

        if (key && KNOWLEDGE_BASE[key]) {
            entry = KNOWLEDGE_BASE[key];
        } else {
            // 软兜底
            entry = KNOWLEDGE_BASE.fallbackWeak;
            usedKey = 'fallbackWeak';
        }

        let reply = typeof entry === 'object' ? entry.a : entry;
        let buttons = entry.buttons || [];

        // 更新对话历史
        conversationHistory.push({ role: 'user', content: input, topic: usedKey });
        conversationHistory.push({ role: 'bot', content: reply, topic: usedKey });

        if (conversationHistory.length > 20) {
            conversationHistory = conversationHistory.slice(-20);
        }

        // 保存按钮供UI使用
        lastButtons = buttons;

        return { reply, buttons };
    }

    function getWelcome() {
        const entry = KNOWLEDGE_BASE.welcome;
        lastButtons = entry.buttons || [];
        return { reply: entry.a, buttons: lastButtons };
    }


    // ================================================================
    //  3. UI 渲染
    // ================================================================

    const messagesContainer = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    let isProcessing = false;

    function renderMessage(text, sender, buttons = []) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = sender === 'bot' ? 'W' : '你';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = text.replace(/\n/g, '<br>');

        div.appendChild(avatar);
        div.appendChild(bubble);
        messagesContainer.appendChild(div);

        if (buttons && buttons.length > 0) {
            const btnContainer = document.createElement('div');
            btnContainer.className = 'quick-replies';
            btnContainer.id = 'qr-' + Date.now();
            for (const label of buttons) {
                const btn = document.createElement('button');
                btn.className = 'qr-btn';
                btn.textContent = label;
                btn.dataset.label = label;
                btn.addEventListener('click', function() {
                    const label = this.dataset.label;
                    userInput.value = label;
                    sendMessage();
                });
                btnContainer.appendChild(btn);
            }
            messagesContainer.appendChild(btnContainer);
        }

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function renderTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typing-indicator';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'W';
        const typing = document.createElement('div');
        typing.className = 'typing-indicator';
        for (let i = 0; i < 3; i++) {
            const span = document.createElement('span');
            typing.appendChild(span);
        }
        div.appendChild(avatar);
        div.appendChild(typing);
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function removeTyping() {
        const typing = document.getElementById('typing-indicator');
        if (typing) typing.remove();
    }

    async function sendMessage() {
        if (isProcessing) return;
        const text = userInput.value.trim();
        if (!text) return;

        userInput.value = '';
        renderMessage(text, 'user');
        isProcessing = true;

        renderTyping();

        await new Promise(resolve => setTimeout(resolve, 600 + Math.random() * 600));

        removeTyping();

        const { reply, buttons } = getResponse(text);
        renderMessage(reply, 'bot', buttons);

        isProcessing = false;
        userInput.focus();
    }

    // ---------- 事件绑定 ----------
    sendBtn.addEventListener('click', sendMessage);

    userInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 自动调整 textarea 高度
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // ---------- 启动对话 ----------
    const welcome = getWelcome();
    renderMessage(welcome.reply, 'bot', welcome.buttons);
</script>
