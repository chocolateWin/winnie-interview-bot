  // ================================================================
  //  查找函数
  // ================================================================

  function findKnowledgeBaseEntry(key) {
    if (KNOWLEDGE_BASE[key]) return { entry: KNOWLEDGE_BASE[key], key: key };
    for (const k in KNOWLEDGE_BASE) {
      const entry = KNOWLEDGE_BASE[k];
      if (entry.syns) {
        for (const syn of entry.syns) {
          if (syn.includes(key) || key.includes(syn)) {
            return { entry: entry, key: k };
          }
        }
      }
    }
    return null;
  }

  // ================================================================
  //  UI 交互
  // ================================================================

  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  let isProcessing = false;
  let currentQuickReplies = [];

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function addMessage(text, isUser, quickReplies) {
    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper';

    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'message-user' : ''}`;

    const avatar = document.createElement('div');
    avatar.className = `message-avatar ${isUser ? 'message-avatar-user' : 'message-avatar-ai'}`;
    avatar.textContent = isUser ? 'U' : 'W';

    const bubble = document.createElement('div');
    bubble.className = `message-bubble ${isUser ? 'message-bubble-user' : 'message-bubble-ai'}`;
    bubble.innerHTML = text.replace(/\n/g, '<br>');

    messageDiv.appendChild(avatar);
    messageDiv.appendChild(bubble);
    wrapper.appendChild(messageDiv);

    if (!isUser && quickReplies && quickReplies.length > 0) {
      const repliesDiv = document.createElement('div');
      repliesDiv.className = 'quick-replies';
      quickReplies.forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'quick-reply-btn';
        btn.textContent = label;
        btn.onclick = () => {
          messageInput.value = label;
          sendMessage();
        };
        repliesDiv.appendChild(btn);
      });
      wrapper.appendChild(repliesDiv);
      currentQuickReplies = quickReplies;
    } else {
      currentQuickReplies = [];
    }

    chatMessages.appendChild(wrapper);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message';
    typingDiv.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar message-avatar-ai';
    avatar.textContent = 'W';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble message-bubble-ai';
    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

    bubble.appendChild(indicator);
    typingDiv.appendChild(avatar);
    typingDiv.appendChild(bubble);

    chatMessages.appendChild(typingDiv);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  function matchQuestion(userMsg) {
    const lowerMsg = userMsg.toLowerCase();

    let bestMatch = null;
    let bestScore = 0;

    for (const key in KNOWLEDGE_BASE) {
      const entry = KNOWLEDGE_BASE[key];
      if (!entry.syns) continue;
      let score = 0;
      const allKeywords = [entry.core, ...entry.syns];
      for (const kw of allKeywords) {
        if (lowerMsg.includes(kw.toLowerCase())) {
          score += 2;
        }
      }
      for (const syn of entry.syns) {
        if (lowerMsg.includes(syn.toLowerCase())) {
          score += 1;
        }
      }
      if (userMsg.length > 10) score += 0.3;
      if (score > bestScore) {
        bestScore = score;
        bestMatch = entry;
      }
    }

    if (bestScore >= 2.5 && bestMatch) {
      return { entry: bestMatch, score: bestScore };
    }
    return null;
  }

  function getFallback(userMsg) {
    const hardKeywords = ['薪资', '工资', '待遇', '薪酬', '期望薪资', '到岗时间', '入职时间'];
    for (const kw of hardKeywords) {
      if (userMsg.includes(kw)) {
        return { type: 'hard', entry: KNOWLEDGE_BASE.fallbackHard };
      }
    }
    return { type: 'weak', entry: KNOWLEDGE_BASE.fallbackWeak };
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || isProcessing) return;

    messageInput.value = '';
    isProcessing = true;
    sendBtn.disabled = true;

    addMessage(text, true);

    addTypingIndicator();

    await new Promise(resolve => setTimeout(resolve, 800 + Math.random() * 700));

    removeTypingIndicator();

    let entry = null;
    let quickReplies = [];

    // 硬编码处理“自我介绍”
    if (text === '自我介绍') {
      entry = KNOWLEDGE_BASE.self_intro;
      quickReplies = entry.quickReplies || [];
    }

    // 直接匹配按钮映射
    if (!entry && QUICK_REPLY_MAP[text]) {
      const found = findKnowledgeBaseEntry(QUICK_REPLY_MAP[text]);
      if (found) {
        entry = found.entry;
        quickReplies = entry.quickReplies || [];
      }
    }

    // 模糊匹配
    if (!entry) {
      const result = matchQuestion(text);
      if (result) {
        entry = result.entry;
        quickReplies = entry.quickReplies || [];
      }
    }

    // 兜底
    if (!entry) {
      const fb = getFallback(text);
      entry = fb.entry;
      quickReplies = entry.quickReplies || [];
    }

    addMessage(entry.answer, false, quickReplies);

    isProcessing = false;
    sendBtn.disabled = false;
  }

  messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  messageInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });

  sendBtn.addEventListener('click', sendMessage);
