  <meta charset="UTF-8" />

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-light: #3b82f6;
      --accent-color: #06b6d4;
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    @media (min-width: 1024px) {
      .container {
        flex-direction: row;
      }
    }

    .sidebar {
      width: 100%;
      max-width: 320px;
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    @media (min-width: 1024px) {
      .sidebar {
        border-right: 1px solid var(--border-color);
        border-bottom: none;
      }
    }

    .profile-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .profile-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .profile-alias {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .profile-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 20px;
      font-size: 12px;
      color: #60a5fa;
      margin-bottom: 20px;
    }

    .profile-info {
      text-align: left;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-icon {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60a5fa;
      font-size: 12px;
    }

    .info-content {
      flex: 1;
    }

    .info-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 13px;
      color: var(--text-primary);
    }

    .link-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .link-btn-primary {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }

    .link-btn-primary:hover {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93bbfc;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }

    .link-btn-secondary {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .link-btn-secondary:hover {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.4);
      color: #93bbfc;
      transform: translateY(-2px);
    }

    .link-btn-feedback {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 13px;
    }

    .link-btn-feedback:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      transform: translateY(-2px);
    }

    .link-external-icon {
      font-size: 12px;
      opacity: 0.6;
      margin-left: 2px;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .chat-status {
      font-size: 12px;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .message {
      display: flex;
      gap: 12px;
    }

    .message-user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
    }

    .message-avatar-ai {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
    }

    .message-avatar-user {
      background: rgba(255, 255, 255, 0.15);
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .message-bubble-ai {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message-bubble-user {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .chat-input-area {
      padding: 20px 24px;
      border-top: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.95);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
    }

    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .input-field::placeholder {
      color: #64748b;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6, #22d3ee);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .send-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .system-badge {
      text-align: center;
      padding: 8px 16px;
      margin-bottom: 16px;
    }

    .system-badge span {
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .divider {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* 新增：追问按钮样式 */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .quick-reply-btn {
      padding: 6px 14px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      color: #60a5fa;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-reply-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
    }

    /* 新增：话题标签 */
    .topic-tag {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(6, 182, 212, 0.15);
      border-radius: 4px;
      color: #22d3ee;
      font-size: 12px;
      margin-right: 6px;
    }
  </style>

  <script>
    // ============================================================
    // 🧠 核心改进：对话状态管理 + 意图识别 + 话题追踪
    // ============================================================

    // ---------- 1. 对话状态机 ----------
    const ConversationState = {
      currentTopic: null,      // 当前话题：'project' | 'internship' | 'skills' | ...
      lastIntent: null,        // 上一个意图
      depth: 0,                // 当前话题深度（追问次数）
      history: [],             // 对话历史（最近5轮）
      topicStack: [],          // 话题栈（支持话题切换后恢复）

      // 记录一轮对话
      push(userMsg, aiMsg, intent) {
        this.history.push({ user: userMsg, ai: aiMsg, intent, time: Date.now() });
        if (this.history.length > 5) this.history.shift();
        if (intent && intent.topic) {
          this.topicStack.push({ topic: intent.topic, depth: this.depth });
          if (this.topicStack.length > 3) this.topicStack.shift();
        }
      },

      // 获取最近的话题
      getRecentTopic() {
        return this.topicStack.length > 0 
          ? this.topicStack[this.topicStack.length - 1].topic 
          : null;
      },

      // 重置
      reset() {
        this.currentTopic = null;
        this.lastIntent = null;
        this.depth = 0;
        this.history = [];
        this.topicStack = [];
      }
    };

    // ---------- 2. 意图定义（带话题归属 + 权重）----------
    const INTENTS = {
      // === 基础介绍 ===
      greeting: {
        topic: 'intro',
        weight: 10,
        keywords: ['介绍', '自己', '自我介绍', '你是谁', '你好', 'hi', 'hello', '您好', '认识一下', '简单说说'],
        answer: '我目前的核心标签是：从汉语言到 AI 产品的复合型选手——一边是运营了两年的小红书账号，单篇最高 3.1 万+ 阅读、累计 3 万赞；一边是最近独立用 Vibe Coding 完成的阅读记录小程序，15 个引导式锚点 + 4 大核心模块，从 PRD 到上线全流程自己扛。\n\n做这件事的初心其实很简单——我认为产品是一个通用的观念，无论是内容、代码还是人生，用产品思维去打磨都会越来越好。所以我不是"跨界"，是把同一件事做到了不同介质上。\n\n您想先了解哪方面？',
        followUps: ['实习经历', '项目作品', 'AI产品理解', '教育背景']
      },

      // === 动机/初心 ===
      motivation: {
        topic: 'motivation',
        weight: 10,
        keywords: ['为什么', '选择', 'AI产品', '方向', '跨界', '动机', '初心', '产品观', '产品思维', '理念', '想做产品'],
        answer: '我选择 AI 产品方向，核心是相信产品思维可以跨越介质。我做小红书运营时，就是在用产品思维做内容——定义用户、验证假设、数据迭代。后来发现 AI 工具可以帮我把这种思维从内容延伸到代码，就用 Vibe Coding 做了小程序。\n\n产品是一个通用的观念，我们学习进步本质上也是在磨炼产品。我不觉得自己是"跨界"，而是把"把一件事做成好产品"这件事从内容做到了代码。',
        followUps: ['具体说说小程序', '实习怎么体现产品思维', '你的Vibe Coding经验']
      },

      // === 技术能力 ===
      techSkills: {
        topic: 'skills',
        weight: 10,
        keywords: ['技术', '能力', '够吗', '编程', '代码', '计算机', '开发', '全栈', '前端', '后端', '技术栈', '会什么技术'],
        answer: '坦白说，我不是计算机科班出身，但我用行动证明了学习能力和交付能力。我自学 SQL 在力扣和牛客上刷过题，能实战解题；用 Vibe Coding 独立完成了阅读记录小程序，从 PRD 到上线全流程自己扛。\n\n更重要的是，我理解 AI 产品的核心不是写代码，而是理解用户需求、设计产品逻辑、用 AI 工具实现价值。当然，如果岗位有特定技术要求，我也愿意快速补齐。',
        followUps: ['SQL具体水平', 'Vibe Coding怎么做的', '小程序技术细节']
      },

      // === 核心项目 ===
      project: {
        topic: 'project',
        weight: 10,
        keywords: ['项目', '最有成就感', '小程序', '输出第一', '作品', '代表作', '亮点', '核心项目', '做过什么', '什么项目', '代表作'],
        answer: '最有成就感的项目是【输出第一】阅读/观影记录小程序。当时我体验了豆瓣、微信读书后发现一个痛点：面对空白输入框，用户表达门槛很高。于是我设计了 15 个引导式锚点，让"没话说"变成"想说"。\n\n这个项目让我证明了：我不是"只懂内容不懂技术"的选手，而是能用产品思维驱动 AI 协作，从需求到上线全流程交付的人。这正是 AI 产品实习生最需要的能力。',
        followUps: ['引导式锚点怎么设计的', '技术怎么实现的', '用户反馈如何', '和竞品区别']
      },

      // === 项目追问：锚点设计 ===
      projectAnchors: {
        topic: 'project',
        weight: 8,
        keywords: ['锚点', '引导', '设计', '怎么想到', '空白输入框', '表达门槛', '15个'],
        answer: '锚点的设计思路来自我对用户心理的观察。很多人读完书想记录，但面对空白输入框会"大脑空白"——不知道写什么、从哪写起。\n\n我的解决方式是：把"开放题"变成"选择题"。比如读完一本书，系统会问："这本书最打动你的一句话是？""如果推荐给朋友，你会怎么说？""作者的观点你同意吗？"\n\n每个锚点都是一个低门槛的切入点，用户回答了第一个，第二个就自然流淌出来了。这就是从"没话说"到"想说"的转变。',
        followUps: ['技术怎么实现锚点', '数据表现如何', '后续迭代计划']
      },

      // === 项目追问：技术实现 ===
      projectTech: {
        topic: 'project',

        keywords: ['AI行业', 'AI产品', '岗位理解', '怎么看', '趋势', '行业前景'],
        answer: '我认为 AI 产品正处于从"技术驱动"向"场景驱动"过渡的阶段。早期大家关心"模型有多强"，现在越来越多人关心"能用它解决什么问题"。\n\n这正是产品经理的机会——把技术能力翻译成用户价值。我在泰竑未来实习时做的一件事就是把 EEAT 框架翻译成具体的评测标准，让 AI 产出更贴近业务需求。\n\n所以我认为 AI 产品经理的核心能力是"翻译"——在技术语言和用户语言之间搭建桥梁。而汉语言文学的训练让我对"语言"这件事本身很敏感。',
        followUps: ['具体场景', '翻译能力', '怎么学习']
      },

      // === 展示作品 ===
      showWork: {
        topic: 'portfolio',
        weight: 8,
        keywords: ['展示', '看看', '能看', 'demo', '演示', '作品', '给我看看'],
        answer: '当然可以！\n\n📁 **作品集网站**（含 PRD、Axure 原型、竞品分析）：https://chocolatewin.github.io/my-website/\n\n📱 **小程序项目集**：https://chocolatewin.github.io/PM-Portfolio/\n\n建议先看作品集网站，那里有完整的项目文档和设计过程。看完有任何问题，欢迎随时问我或直接联系我本人。',
        followUps: ['PRD重点', '设计思路', '技术难点']
      },

      // === 补充 ===
      supplement: {
        topic: 'interview',
        weight: 8,
        keywords: ['补充', '还想说', '额外', '其他', '最后', '有什么想说', '没说完'],
        answer: '我想补充一点：很多人觉得"中文系"和"AI产品"之间有一条鸿沟，但我不这么认为。\n\n产品说到底是在理解人、设计解决方案。理解人这件事，中文系训练了四年；设计解决方案这件事，我用 Vibe Coding 和 AI 协作证明了能做。\n\n我觉得好的人才不是"恰好匹配岗位描述"的人，而是"能把不同领域的经验迁移到新场景里"的人。如果您认同这个观点，欢迎深入聊聊——手机/微信 19298915379。',
        followUps: []
      },

      // === 薪资/到岗 ===
      salary: {
        topic: 'interview',
        weight: 10,
        keywords: ['薪资', '到岗', '时间', '工资', '入职', '待遇', '薪酬', '期望', '什么时候', '能来'],
        answer: '关于薪资和到岗时间，这个细节我的简历里没有展开，欢迎联系我细聊，手机/微信 19298915379。\n\n我可以先告诉您：我对实习的优先级是**学习机会 > 团队氛围 > 薪资**，希望能在一个有挑战、有反馈的环境里快速成长。',
        followUps: []
      },

      // === 确认/展开 ===
      confirm: {
        topic: 'followup',
        weight: 5,
        keywords: ['可以', '好的', '嗯', '行', '好', 'ok', 'OK', '是的', '对', '展开', '详细', '说说', '讲讲'],
        answer: '',  // 动态生成，依赖上下文
        followUps: []
      }
    };

    // ---------- 3. 追问意图（需要上下文的话题关联）----------
    const FOLLOWUP_INTENTS = {
      // 通用追问词
      generic: {
        keywords: ['为什么', '怎么', '具体', '详细', '展开', '说说', '讲讲', '然后呢', '后来呢', '结果呢'],
        handler: (topic, lastAnswer) => {
          // 根据当前话题生成追问回复
          const topicHandlers = {
            project: '关于项目，您是想了解技术实现细节、用户数据反馈、还是后续的迭代计划？',
            experience: '关于实习经历，您是想深入了解泰竑的工作内容、还是去哪儿的运营数据？',
            skills: '关于技能方面，您是想了解 SQL 的具体水平、还是 Vibe Coding 的工作流？',
            motivation: '关于我的动机，您是想了解转行的具体契机、还是对产品思维的理解？',
            portfolio: '关于作品集，您是想看 PRD 样本、还是竞品分析的具体案例？',
            background: '关于我的背景，您是想了解学校的课程安排、还是自学路径？',
            self: '关于我个人，您是想了解我的学习习惯、还是团队协作风格？',
            product: '关于产品理解，您是想聊 AI 产品的趋势、还是具体的设计方法论？',
            interview: '关于面试，您还有什么想了解的吗？'
          };
          return topicHandlers[topic] || '您想让我从哪个角度再展开聊聊？';
        }
      },

      // 数字选择
      numberChoice: {
        keywords: ['1', '2', '3', '4', '5', '第一个', '第二个', '第三个'],
        handler: (topic, lastAnswer, userMsg) => {
          // 从上一轮AI回复中提取 followUps
          const lastIntent = ConversationState.lastIntent;
          if (lastIntent && lastIntent.followUps) {
            const num = parseInt(userMsg.match(/\d+/)?.[0] || '1');
            const choice = lastIntent.followUps[num - 1];
            if (choice) {
              return `关于"${choice}"，${getAnswerByTopic(choice)}`;
            }
          }
          return '您指的是哪个方面？可以直接告诉我具体内容，比如"说说小程序"或者"讲讲实习"。';
        }
      }
    };

    // 根据话题关键词获取答案（简化版）
    function getAnswerByTopic(keyword) {
      for (const [key, intent] of Object.entries(INTENTS)) {
        if (intent.followUps && intent.followUps.includes(keyword)) {
          return intent.answer;
        }
        for (const kw of intent.keywords) {
          if (keyword.includes(kw) || kw.includes(keyword)) {
            return intent.answer;
          }
        }
      }
      return '这个话题很有意思，我可以从几个方面展开，您想先听哪个？';
    }

    // ---------- 4. 智能匹配引擎 ----------
    function findBestIntent(userMsg) {
      const lowerMsg = userMsg.toLowerCase().trim();

      // 步骤1：检查是否是追问意图（需要上下文）
      const recentTopic = ConversationState.getRecentTopic();

      // 如果是纯追问词（很短）
      if (lowerMsg.length <= 6) {
        for (const [key, followup] of Object.entries(FOLLOWUP_INTENTS)) {
          for (const kw of followup.keywords) {
            if (lowerMsg.includes(kw.toLowerCase())) {
              return {
                type: 'followup',
                handler: followup.handler,
                topic: recentTopic
              };
            }
          }
        }
      }

      // 步骤2：计算每个意图的匹配分数
      let bestMatch = null;
      let bestScore = 0;

      for (const [intentKey, intent] of Object.entries(INTENTS)) {
        let score = 0;
        let matchedKeywords = [];

        for (const keyword of intent.keywords) {
          const lowerKeyword = keyword.toLowerCase();
          if (lowerMsg.includes(lowerKeyword)) {
            // 完整词匹配 > 部分匹配
            const regex = new RegExp(`(^|[^\w])${lowerKeyword}([^\w]|$)`);
            if (regex.test(lowerMsg)) {
              score += intent.weight * 1.5;  // 完整词权重更高
            } else {
              score += intent.weight;
            }
            matchedKeywords.push(keyword);
          }
        }

        // 话题连续性加分（如果和当前话题一致）
        if (intent.topic === recentTopic) {
          score *= 1.3;
        }

        if (score > bestScore) {
          bestScore = score;
          bestMatch = { ...intent, key: intentKey, score, matchedKeywords };
        }
      }

      // 步骤3：阈值判断
      if (bestScore >= 8) {
        return { type: 'direct', intent: bestMatch };
      }

      // 步骤4：模糊匹配 - 检查是否包含话题相关词
      if (recentTopic) {
        const topicKeywords = {
          project: ['它', '这个', '那个', '项目', '小程序', '作品'],
          experience: ['实习', '工作', '那段', '经历'],
          skills: ['技术', '能力', '工具', 'SQL'],
          motivation: ['动机', '为什么', '初心'],
          portfolio: ['网站', '作品集', '链接'],
          background: ['学校', '专业', '大学'],
          self: ['你', '自己', '个人'],
          product: ['产品', '设计', '用户'],
          interview: ['面试', '岗位', '公司']
        };

        const topicKws = topicKeywords[recentTopic] || [];
        for (const kw of topicKws) {
          if (lowerMsg.includes(kw)) {
            // 返回追问处理器
            return {
              type: 'followup',
              handler: FOLLOWUP_INTENTS.generic.handler,
              topic: recentTopic
            };
          }
        }
      }

      return null;
    }

    // ---------- 5. 生成回复 ----------
    function generateAnswer(userMsg) {
      const result = findBestIntent(userMsg);

      if (!result) {
        // 完全没匹配到 - 智能 fallback
        return generateSmartFallback(userMsg);
      }

      if (result.type === 'followup') {
        const lastAnswer = ConversationState.history.length > 0 
          ? ConversationState.history[ConversationState.history.length - 1].ai 
          : '';
        return result.handler(result.topic, lastAnswer, userMsg);
      }

      // 直接匹配
      const intent = result.intent;
      ConversationState.currentTopic = intent.topic;
      ConversationState.lastIntent = intent;
      ConversationState.depth++;

      return intent.answer;
    }

    // ---------- 6. 智能 Fallback ----------
    function generateSmartFallback(userMsg) {
      const recentTopic = ConversationState.getRecentTopic();
      const lowerMsg = userMsg.toLowerCase();

      // 尝试理解用户可能在问什么
      const possibleTopics = [];

      // 检查是否和最近话题相关
      if (recentTopic) {
        const topicNames = {
          project: '项目',
          experience: '实习',
          skills: '技能',
          motivation: '动机',
          portfolio: '作品集',
          background: '背景',
          self: '个人',
          product: '产品',
          interview: '面试'
        };
        possibleTopics.push(topicNames[recentTopic]);
      }

      // 通用引导
      let response = '这个问题我可能需要更多上下文来准确回答。';

      if (recentTopic) {
        response += `我们刚才在聊"${topicNames[recentTopic]}"方面，您是想继续这个话题，还是换个方向？\n\n`;
      } else {
        response += '\n\n';
      }

      response += '您可以这样问我：\n';
      response += '• "介绍一下你自己"\n';
      response += '• "说说你的实习经历"\n';
      response += '• "你做过什么项目"\n';
      response += '• "你的技术能力怎么样"\n';
      response += '• "为什么想做 AI 产品"\n\n';
      response += '或者直接告诉我您想了解的具体方向 😊';

      return response;
    }

    // ---------- 7. 追问按钮生成 ----------
    function generateQuickReplies(intent) {
      if (!intent || !intent.followUps || intent.followUps.length === 0) {
        return [];
      }
      return intent.followUps.slice(0, 4);
    }

    // ============================================================
    // 💬 UI 交互层（保持原有样式，增强功能）
    // ============================================================

    let isTyping = false;
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function formatMessage(text) {
      // 支持 markdown 风格的粗体和链接
      let formatted = text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
      return formatted;
    }

    function addMessage(text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'message-user' : ''}`;

      const avatar = document.createElement('div');
      avatar.className = `message-avatar ${isUser ? 'message-avatar-user' : 'message-avatar-ai'}`;
      avatar.textContent = isUser ? 'U' : 'W';

      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isUser ? 'message-bubble-user' : 'message-bubble-ai'}`;
      bubble.innerHTML = formatMessage(text);

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);

      chatMessages.appendChild(messageDiv);
      scrollToBottom();
    }

    // 添加带追问按钮的消息
    function addMessageWithReplies(text, quickReplies) {
      addMessage(text, false);

      if (quickReplies && quickReplies.length > 0) {
        const replyDiv = document.createElement('div');
        replyDiv.className = 'message';
        replyDiv.style.marginTop = '-8px';

        const spacer = document.createElement('div');
        spacer.className = 'message-avatar';
        spacer.style.visibility = 'hidden';
        replyDiv.appendChild(spacer);

        const btnContainer = document.createElement('div');
        btnContainer.className = 'quick-replies';

        quickReplies.forEach(reply => {
          const btn = document.createElement('button');
          btn.className = 'quick-reply-btn';
          btn.textContent = reply;
          btn.onclick = () => {
            messageInput.value = reply;
            sendMessage();
          };
          btnContainer.appendChild(btn);
        });

        replyDiv.appendChild(btnContainer);
        chatMessages.appendChild(replyDiv);
        scrollToBottom();
      }
    }

    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.id = 'typingIndicator';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar message-avatar-ai';
      avatar.textContent = 'W';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble message-bubble-ai';

      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

      bubble.appendChild(indicator);
      typingDiv.appendChild(avatar);
      typingDiv.appendChild(bubble);

      chatMessages.appendChild(typingDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isTyping) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';
      isTyping = true;
      sendBtn.disabled = true;

      // 显示用户消息
      addMessage(text, true);

      // 模拟思考
      setTimeout(() => {
        addTypingIndicator();

        setTimeout(() => {
          removeTypingIndicator();

          // 🧠 核心：使用新的匹配引擎
          const answer = generateAnswer(text);

          // 获取追问按钮
          const quickReplies = generateQuickReplies(ConversationState.lastIntent);

          // 记录对话历史
          ConversationState.push(text, answer, ConversationState.lastIntent);

          // 显示回复（带追问按钮）
          addMessageWithReplies(answer, quickReplies);

          isTyping = false;
          sendBtn.disabled = false;
        }, 1500 + Math.random() * 1000);
      }, 300);
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // 初始化欢迎消息
    const welcomeMsg = '您好！我是陈致巧，大家都叫我 Winnie。目前在兰州大学读汉语言文学，同时也在探索 AI 产品方向。\n\n我运营小红书账号两年多，累计 3 万赞，单篇最高 3.1 万+ 阅读；最近用 Vibe Coding 独立做了一个阅读/观影记录小程序，15 个引导式锚点 + 4 大核心模块，从 PRD 到上线全流程自己扛。\n\n您想先了解哪方面？';

    addMessageWithReplies(welcomeMsg, ['实习经历', '项目作品', 'AI产品理解', '教育背景']);

    // 记录初始状态
    ConversationState.push('', welcomeMsg, INTENTS.greeting);
  </script>
