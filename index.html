      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function formatMessage(text) {
      return text.replace(/\n/g, '<br>');
    }

    function addMessage(text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'message-user' : ''}`;
      
      const avatar = document.createElement('div');
      avatar.className = `message-avatar ${isUser ? 'message-avatar-user' : 'message-avatar-ai'}`;
      avatar.textContent = isUser ? 'U' : 'W';
      
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isUser ? 'message-bubble-user' : 'message-bubble-ai'}`;
      bubble.innerHTML = formatMessage(text);
      
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);
      
      chatMessages.appendChild(messageDiv);
      scrollToBottom();

      // 如果是 AI 消息，保存以备后用
      if (!isUser) {
        lastAIMessage = text;
      }
    }

    function addTypingIndicator() {
      const typingDiv = document.createElement('div');

      bubble.appendChild(indicator);
      typingDiv.appendChild(avatar);

      chatMessages.appendChild(typingDiv);

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    function findMockAnswer(question) {
      const lowerQuestion = question.toLowerCase();
      
      for (const mock of MOCK_ANSWERS) {
        for (const keyword of mock.keywords) {
          if (lowerQuestion.includes(keyword.toLowerCase())) {
            return mock.answer;
          }
        }
      }
      
      return KNOWLEDGE_BASE.fallbackMessage;
    }

    // 判断是否为确认词

      const confirms = ["可以", "好的", "嗯", "行", "好", "ok", "okay", "是的", "对", "没错", "嗯嗯", "好呀", "可以啊"];
      const clean = text.trim().toLowerCase();
      return confirms.includes(clean) || /^(好|行|可以|嗯|ok|是的|对)$/i.test(clean);
    }

      isTyping = true;
      sendBtn.disabled = true;

      // 显示用户消息
      addMessage(text, true);
      
      // 模拟思考
      setTimeout(() => {
        addTypingIndicator();
        
        setTimeout(() => {
          removeTypingIndicator();

          let answer;
          // 如果用户输入的是确认词，则使用引导回复（在MOCK_ANSWERS中已有"可以"条目）
          if (isConfirmWord(text)) {
            // 直接使用“可以”关键词的回复（会匹配到我们新增的展开引导）
            answer = findMockAnswer("可以");
          } else {
            answer = findMockAnswer(text);
          }
          
          addMessage(answer, false);
          
          isTyping = false;
          sendBtn.disabled = false;
        }, 1500 + Math.random() * 1000);
      }, 300);
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // 初始化欢迎消息
    addMessage("您好！我是陈致巧，大家都叫我 Winnie。目前在兰州大学读汉语言文学，同时也在探索 AI 产品方向。\n\n我运营小红书账号两年多，累计 3 万赞，单篇最高 3.1 万+ 阅读；最近用 Vibe Coding 独立做了一个阅读/观影记录小程序，15 个引导式锚点 + 4 大核心模块，从 PRD 到上线全流程自己扛。\n\n您想先了解哪方面？实习经历、项目作品、还是我对 AI 产品的理解？", false);
  </script>
