        // 1. 核心关键词匹配：+2分
        for (const kw of allKeywords) {
          if (lowerMsg.includes(kw.toLowerCase())) {
            score += 2;
          }
        }

        // 2. 同义词匹配：+1分（从SYN_MAP中检索）
        for (const [key, syns] of Object.entries(SYN_MAP)) {
          for (const syn of syns) {
            if (lowerMsg.includes(syn.toLowerCase())) {
              const allQAWords = [qa.core, ...qa.syns];
              for (const word of allQAWords) {
                if (key.includes(word) || word.includes(key)) {
                  score += 1;
                  break;
                }
              }
            }
          }
        }

        // 3. 上文关联加分：+0.5分
        if (recentTopics.length > 0) {
          for (const topic of recentTopics) {
            const allQAWords = [qa.core, ...qa.syns];
            for (const word of allQAWords) {
              if (topic.includes(word) || word.includes(topic)) {
                score += 0.5;
                break;
              }
            }
          }
        }

        // 4. 指代关联：如果用户问"这个""那个""它"，参考最近话题
        if (lowerMsg.includes('这个') || lowerMsg.includes('那个') || lowerMsg.includes('它')) {
          const lastTopic = ChatContext.getLastTopic();
          if (lastTopic) {
            const allQAWords = [qa.core, ...qa.syns];
            for (const word of allQAWords) {
              if (lastTopic.includes(word) || word.includes(lastTopic)) {
                score += 1;
                break;
              }
            }
          }
        }

        // 5. 问题长度加分：越长越具体
        if (userMsg.length > 10) score += 0.3;

        if (score > bestScore) {
          bestScore = score;
          bestMatch = qa;
        }
      }

      if (bestScore >= 2.5 && bestMatch) {
        return { qa: bestMatch, score: bestScore };
      }
      return null;
    }

    // ============================================================
    // 第六部分：兜底逻辑
    // ============================================================
    function getFallback(userMsg) {
      const isHardKeywords = ['薪资', '工资', '待遇', '薪酬', '期望薪资', '到岗时间', '入职时间'];
      const lowerMsg = userMsg.toLowerCase();
      
      for (const kw of isHardKeywords) {
        if (lowerMsg.includes(kw)) {
          return { type: 'hard', message: KNOWLEDGE_BASE.fallbackHard };
        }
      }

      const lastTopic = ChatContext.getLastTopic();
      let guide = '';
      if (lastTopic) {
        guide = `我们刚才在聊「${lastTopic}」方面，您是想继续这个话题，还是换个方向？`;
      } else {
        guide = `您可以试试问我的实习经历、项目作品，或者对 AI 产品的理解。`;
      }

      return {
        type: 'weak',
        message: `这块我暂时没有准备到具体的案例，不过我在相关经历里做过类似的事。${guide}\n\n直接告诉我您想了解的具体方向 👇`
      };
    }

    // ============================================================
    // 第七部分：渲染与交互
    // ============================================================
    let isTyping = false;
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    let currentQuickReplies = [];

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function formatMessage(text) {
      return text.replace(/\n/g, '<br>');
    }

    function addMessage(text, isUser, quickReplies) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper';

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'message-user' : ''}`;

      const avatar = document.createElement('div');
      avatar.className = `message-avatar ${isUser ? 'message-avatar-user' : 'message-avatar-ai'}`;
      avatar.textContent = isUser ? 'U' : 'W';

      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isUser ? 'message-bubble-user' : 'message-bubble-ai'}`;
      bubble.innerHTML = formatMessage(text);

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);
      wrapper.appendChild(messageDiv);

      if (!isUser && quickReplies && quickReplies.length > 0) {
        const repliesDiv = document.createElement('div');
        repliesDiv.className = 'quick-replies';
        quickReplies.forEach(label => {
          const btn = document.createElement('button');
          btn.className = 'quick-reply-btn';
          btn.textContent = label;
          btn.onclick = () => {
            messageInput.value = label;
            sendMessage();
          };
          repliesDiv.appendChild(btn);
        });
        wrapper.appendChild(repliesDiv);
        currentQuickReplies = quickReplies;
      } else {
        currentQuickReplies = [];
      }

      chatMessages.appendChild(wrapper);
      scrollToBottom();
    }

    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.id = 'typingIndicator';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar message-avatar-ai';
      avatar.textContent = 'W';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble message-bubble-ai';

      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

      bubble.appendChild(indicator);
      typingDiv.appendChild(avatar);
      typingDiv.appendChild(bubble);

      chatMessages.appendChild(typingDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    function isNumberChoice(text) {
      const clean = text.trim();
      return /^[1-5]$/.test(clean) || /^第[一二三四五]个$/.test(clean) || /^[一二三四五]$/.test(clean);
    }

    function parseNumberChoice(text) {
      const clean = text.trim();
      if (/^[1-5]$/.test(clean)) return parseInt(clean) - 1;
      const map = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5 };
      for (const [key, val] of Object.entries(map)) {
        if (clean.includes(key)) return val - 1;
      }
      return -1;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isTyping) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';
      isTyping = true;
      sendBtn.disabled = true;

      addMessage(text, true);

      setTimeout(() => {
        addTypingIndicator();

        setTimeout(() => {
          removeTypingIndicator();

          let answer = '';
          let topic = '';
          let quickReplies = [];

          // 1. 检查数字选择
          if (isNumberChoice(text) && currentQuickReplies.length > 0) {
            const idx = parseNumberChoice(text);
            if (idx >= 0 && idx < currentQuickReplies.length) {
              const chosen = currentQuickReplies[idx];
              const result = matchQuestion(chosen);
              if (result) {
                answer = result.qa.answer;
                topic = result.qa.core;
                quickReplies = result.qa.quickReplies || [];
              }
            }
          }

          // 2. 正常匹配
          if (!answer) {
            const result = matchQuestion(text);
            if (result) {
              answer = result.qa.answer;
              topic = result.qa.core;
              quickReplies = result.qa.quickReplies || [];
            } else {
              // 3. 兜底
              const fb = getFallback(text);
              answer = fb.message;
              if (fb.type === 'hard') {
                quickReplies = ['自我介绍', '聊聊项目', '说说实习'];
              } else {
                quickReplies = ['实习经历', '项目作品', 'AI 产品理解', '自我介绍'];
              }
            }
          }

          ChatContext.push(text, answer, topic);
          addMessage(answer, false, quickReplies);

          isTyping = false;
          sendBtn.disabled = false;
        }, 1200 + Math.random() * 800);
      }, 300);
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // ============================================================
    // 第八部分：初始化（清晰欢迎语）
    // ============================================================
    addMessage(
      `👋 你好！我是 Winnie 的 AI 面试分身。

      我的任务是帮你快速了解 Winnie——她是谁、做过什么、为什么适合 AI 产品实习岗位。

      你可以直接问我：
      • “介绍一下你自己”
      • “你做过什么项目”
      • “说说你的实习经历”
      • “你对 AI 产品怎么理解”

      或者直接点击下面的按钮开始 👇`,
      false,
      ['自我介绍', '实习经历', '项目作品', 'AI 产品理解']
    );
  </script>
</body>
</html>
