    let chatContext = [];
    let lastAIMessage = "";
    let isTyping = false;
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function formatMessage(text) {
      return text.replace(/\n/g, '<br>');
    }

    function addMessage(text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'message-user' : ''}`;
      
      const avatar = document.createElement('div');
      avatar.className = `message-avatar ${isUser ? 'message-avatar-user' : 'message-avatar-ai'}`;
      avatar.textContent = isUser ? 'U' : 'W';
      
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isUser ? 'message-bubble-user' : 'message-bubble-ai'}`;
      bubble.innerHTML = formatMessage(text);
      
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);
      
      chatMessages.appendChild(messageDiv);
      scrollToBottom();

      if (isUser) {
        chatContext.push({role:"user", content:text});
      } else {
        lastAIMessage = text;
        chatContext.push({role:"ai", content:text});
      }
    }

    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.id = 'typingIndicator';
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar message-avatar-ai';
      avatar.textContent = 'W';
      
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble message-bubble-ai';
      
      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      
      bubble.appendChild(indicator);
      typingDiv.appendChild(avatar);
      typingDiv.appendChild(bubble);
      
      chatMessages.appendChild(typingDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    function matchQuestion(inputText) {
        const lowerText = inputText.toLowerCase().trim();
        let maxScore = 0;
        let targetAnswer = KNOWLEDGE_BASE.weakFallback;
        for (const item of MOCK_ANSWERS) {
            let hitScore = 0;
            for (const c of item.core) {
                if (lowerText.includes(c.toLowerCase())) hitScore += 2;
            }
            for (const s of item.syns) {
                if (lowerText.includes(s.toLowerCase())) hitScore += 1;
            }
            const recentChat = chatContext.slice(-4);
            for (const ctx of recentChat) {
                if (ctx.role === "ai") {
                    for (const c of item.core) {
                        if (ctx.content.includes(c)) hitScore += 0.5;
                    }
                }
            }
            if (hitScore > maxScore) {
                maxScore = hitScore;
                targetAnswer = item.answer;
            }
        }
        return targetAnswer;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isTyping) return;
      messageInput.value = '';
      messageInput.style.height = 'auto';
      isTyping = true;
      sendBtn.disabled = true;
      addMessage(text, true);
      setTimeout(() => {
        addTypingIndicator();
        setTimeout(() => {
          removeTypingIndicator();
          const res = matchQuestion(text);
          addMessage(res, false);
          isTyping = false;
          sendBtn.disabled = false;
        }, 1500 + Math.random() * 1000);
      }, 300);
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });
