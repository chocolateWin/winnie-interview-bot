    let isTyping = false;
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function formatMessage(text) {
      return text.replace(/\n/g, '<br>');
    }

    function addMessage(text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'message-user' : ''}`;
      
      const avatar = document.createElement('div');
      avatar.className = `message-avatar ${isUser ? 'message-avatar-user' : 'message-avatar-ai'}`;
      avatar.textContent = isUser ? 'U' : 'W';
      
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isUser ? 'message-bubble-user' : 'message-bubble-ai'}`;
      bubble.innerHTML = formatMessage(text);
      
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(bubble);
      
      chatMessages.appendChild(messageDiv);
      scrollToBottom();
    }

    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message';
      typingDiv.id = 'typingIndicator';
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar message-avatar-ai';
      avatar.textContent = 'W';
      
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble message-bubble-ai';
      
      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      
      bubble.appendChild(indicator);
      typingDiv.appendChild(avatar);
      typingDiv.appendChild(bubble);
      
      chatMessages.appendChild(typingDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    function findMockAnswer(question) {
      const lowerQuestion = question.toLowerCase();
      
      for (const mock of MOCK_ANSWERS) {
        for (const keyword of mock.keywords) {
          if (lowerQuestion.includes(keyword.toLowerCase())) {
            return mock.answer;
          }
        }
      }
      
      return KNOWLEDGE_BASE.fallbackMessage;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isTyping) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';
      isTyping = true;
      sendBtn.disabled = true;

      addMessage(text, true);
      
      setTimeout(() => {
        addTypingIndicator();
        
        setTimeout(() => {
          removeTypingIndicator();
          const answer = findMockAnswer(text);
          addMessage(answer, false);
          
          isTyping = false;
          sendBtn.disabled = false;
        }, 1500 + Math.random() * 1000);
      }, 300);
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    addMessage("您好！我是陈致巧，大家都叫我 Winnie。目前在兰州大学读汉语言文学，同时也在探索 AI 产品方向。\n\n我运营小红书账号两年多，累计 3 万赞，单篇最高 2.1 万+ 阅读；最近用 Vibe Coding 独立做了一个阅读/观影记录小程序，15 个引导式锚点 + 4 大核心模块，从 PRD 到上线全流程自己扛。\n\n您想先了解哪方面？实习经历、项目作品、还是我对 AI 产品的理解？", false);
  </script>
